plugins {
	id 'org.springframework.boot' version '2.3.3.RELEASE'
	id 'io.spring.dependency-management' version '1.0.10.RELEASE'
	id 'java'
	id "com.palantir.docker" version "0.25.0"
	id "com.palantir.docker-run" version "0.22.1"
	id "net.ltgt.apt" version "0.21"
	id "net.ltgt.apt-idea" version "0.21"
}

def queryDslVersion = '4.3.1'

group = 'com.surshree.app'
version = '1.0.0-SNAPSHOT'
sourceCompatibility = '1.8'

ext {
	set('springCloudVersion', "Hoxton.SR3")
}

task unpack(type: Copy) {
	project.version = project.findProperty('buildno') ?: 'latest'
	println "Build Version is ${project.version}"
	dependsOn bootJar
	from(zipTree(tasks.bootJar.outputs.files.singleFile))
	into("build/dependency")
	println "Unpack Done"
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

docker {
	dependsOn unpack

	name "preraktiwari/ss_be:${project.version}"
	tag 'stable', "preraktiwari/ss_be:${project.version}"
	tag 'versioned', "preraktiwari/ss_be:${project.version}"


	copySpec.from(tasks.unpack.outputs).into("dependency")
	buildArgs(['DEPENDENCY': "dependency"])
	labels(['env': 'home'])
}

//dockerRun {
//	name "${project.name}"
//	image "${project.name}:${project.version}"
//	ports '8080:8080'
//	clean true
//}



repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
	maven { url 'https://repo.spring.io/snapshot' }
	maven { url "https://plugins.gradle.org/m2/" }
	google()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}


dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.cloud:spring-cloud-starter-oauth2'
	implementation 'org.projectlombok:lombok:1.18.20'  // Replace with the latest compatible version


	compile group: 'org.springframework.cloud', name: 'spring-cloud-starter-feign', version: '1.4.7.RELEASE'

	compile group: 'org.springframework.cloud', name: 'spring-cloud-starter-ribbon', version: '1.4.7.RELEASE'

	implementation('org.postgresql:postgresql')
	// https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt
	implementation( group: 'io.jsonwebtoken', name: 'jjwt', version: '0.9.1')

	// https://mvnrepository.com/artifact/javax.xml.bind/jaxb-api
	implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.1'

	// https://mvnrepository.com/artifact/com.google.guava/guava
	implementation group: 'com.google.guava', name: 'guava', version: '23.0'

	// https://mvnrepository.com/artifact/joda-time/joda-time
	implementation group: 'joda-time', name: 'joda-time', version: '2.10.5'

	compile group: 'commons-lang', name: 'commons-lang', version: '2.6'

	compile group: 'com.razorpay', name: 'razorpay-java', version: '1.3.8'

	implementation group: 'javax.inject', name: 'javax.inject', version: '1'

	compile group: 'org.springframework.cloud', name: 'spring-cloud-starter-kubernetes-all', version: '1.1.3.RELEASE'

	implementation group: 'com.querydsl', name: 'querydsl-jpa', version: "${queryDslVersion}"

	compile("com.querydsl:querydsl-jpa:${queryDslVersion}")

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor(
			"com.querydsl:querydsl-apt:${queryDslVersion}:jpa",
			"org.hibernate.javax.persistence:hibernate-jpa-2.1-api:1.0.2.Final",
			"javax.annotation:javax.annotation-api:1.3.2",
			"org.projectlombok:lombok"
	)

	annotationProcessor 'org.projectlombok:lombok'
	testImplementation('org.springframework.boot:spring-boot-starter-test') {
		exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
	}
	testImplementation 'org.springframework.security:spring-security-test'
	implementation 'org.jetbrains:annotations:15.0'
}

test {
	useJUnitPlatform()
}
