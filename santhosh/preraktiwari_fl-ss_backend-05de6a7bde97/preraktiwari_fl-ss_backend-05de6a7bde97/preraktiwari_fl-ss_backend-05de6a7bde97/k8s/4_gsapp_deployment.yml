apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ss-uat-backend
    env: uat
    type : backend
  name: ss-uat-backend
  namespace: default
spec:
  replicas: 1
  minReadySeconds: 30
  selector:
    matchLabels:
      app: ss-uat-backend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ss-uat-backend
    spec:
      containers:
        - image: preraktiwari/ss_be:1.3
          imagePullPolicy: Always #IfNotPresent
          env:
            - name: TZ
              value: Asia/Kolkata
          name: ss-uat-backend
          ports:
          - name: liveness-port
            containerPort: 8080
          readinessProbe:
            httpGet:
              path: /surshree/health
              port: liveness-port
            failureThreshold: 5
            periodSeconds: 10
            initialDelaySeconds: 60
          livenessProbe:
            httpGet:
              path: /surshree/health
              port: liveness-port
            failureThreshold: 5
            periodSeconds: 10
            initialDelaySeconds: 60
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ss-uat-backend
  name: ss-uat-backend
  namespace: default
spec:
  ports:
    - name: https
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: ss-uat-backend
  sessionAffinity: None
  type: NodePort