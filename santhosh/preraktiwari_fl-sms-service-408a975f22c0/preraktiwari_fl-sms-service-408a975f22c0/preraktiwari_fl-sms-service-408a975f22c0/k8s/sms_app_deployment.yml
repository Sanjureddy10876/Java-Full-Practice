apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sms-service
    env: uat
    type : backend
  name: sms-service
  namespace: st
spec:
  replicas: 1
  minReadySeconds: 45
  selector:
    matchLabels:
      app: sms-service
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: sms-service
    spec:
      containers:
        - image: preraktiwari/sms:1.0
          imagePullPolicy: Always #IfNotPresent
          name: sms-service
          ports:
          - name: liveness-port
            containerPort: 9011
          readinessProbe:
            httpGet:
              path: /sms-service/health
              port: liveness-port
            failureThreshold: 5
            periodSeconds: 10
            initialDelaySeconds: 60
          livenessProbe:
            httpGet:
              path: /sms-service/health
              port: liveness-port
            failureThreshold: 5
            periodSeconds: 10
            initialDelaySeconds: 60
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: sms-service
  name: sms-service
  namespace: st
spec:
  ports:
    - name: http
      port: 9011
      protocol: TCP
      targetPort: 9011
  selector:
    app: sms-service
  sessionAffinity: None
  type: NodePort